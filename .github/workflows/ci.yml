name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # .NET Framework 4.8 타깃은 Windows에서만 실행할 수 있다.
  # Microsoft.Data.SqlClient는 net462 구현체를 runtimes/win 아래에만 배포하므로
  # Mono를 포함한 비Windows 환경에서는 net48 테스트를 실행할 수 없다.
  windows:
    name: Windows (net48 + net10.0)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: NuGet 패키지 캐시
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 빌드 (전체 타깃)
        run: dotnet build DBVC.slnx -c Release

      # 이 저장소의 주 개발 환경(macOS)에서 실행할 수 없는 유일한 검증 대상이다.
      - name: 테스트 - DBVC.Core (net48)
        run: dotnet test tests/DBVC.Core.Tests -f net48 -c Release --logger "trx;LogFileName=core-net48.trx" --results-directory TestResults

      - name: 테스트 - DBVC.Vsix (net48)
        run: dotnet test tests/DBVC.Vsix.Tests -f net48 -c Release --logger "trx;LogFileName=vsix-net48.trx" --results-directory TestResults

      # net48과의 동작 차이를 드러내기 위해 같은 러너에서 함께 돌린다.
      - name: 테스트 - DBVC.Core (net10.0)
        run: dotnet test tests/DBVC.Core.Tests -f net10.0 -c Release --logger "trx;LogFileName=core-net10.trx" --results-directory TestResults

      - name: 테스트 - DBVC.Vsix (net10.0)
        run: dotnet test tests/DBVC.Vsix.Tests -f net10.0 -c Release --logger "trx;LogFileName=vsix-net10.trx" --results-directory TestResults

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/*.trx
          if-no-files-found: warn

  # 주 개발 환경(macOS/Linux)에서 빌드가 깨지지 않는지 확인한다.
  # net48 어셈블리 컴파일은 참조 어셈블리로 가능하지만 실행은 불가능하므로 테스트는 net10.0만 돈다.
  crossplatform:
    name: Linux (빌드 + net10.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: NuGet 패키지 캐시
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 빌드 (전체 타깃)
        run: dotnet build DBVC.slnx -c Release

      - name: 테스트 (net10.0)
        run: |
          dotnet test tests/DBVC.Core.Tests -f net10.0 -c Release
          dotnet test tests/DBVC.Vsix.Tests -f net10.0 -c Release

# ---------------------------------------------------------------------------
# VSIX 패키징(.vsct 컴파일, pkgdef 생성, .vsix 컨테이너)은 CI에서 제외했다.
#
# 과거 "msbuild는 성공하는데 .vsix가 안 생긴다"의 원인은 규명되어 수정됐다. 기록해 둔다.
#
#   원인은 Microsoft.VSSDK.BuildTools 복원 실패도, Condition="'$(OS)' == 'Windows_NT'"도
#   아니었다. 패키지는 정상 복원되고 있었다. 진짜 원인은 DBVC.Vsix.csproj에 import가
#   빠져 있던 것이다 — 패키지의 build\Microsoft.VSSDK.BuildTools.targets는 환경 변수만
#   설정하고, CreateVsixContainer·GeneratePkgDef·VSCTCompile 타깃은
#   tools\VSSDK\Microsoft.VsSDK.targets에 있으며 자동 import되지 않는다.
#   그래서 빌드는 조용히 성공하고 산출물만 없었다.
#
#   함께 드러난 것들: .vsct가 한 번도 컴파일된 적이 없어 잘못된 헤더·심볼 참조가 잠복해
#   있었고(vsshellids.h, guidNoSolution), 매니페스트에 ProductArchitecture와 LICENSE가
#   빠져 있었다. 지금은 모두 수정되어 로컬에서 .vsix가 생성된다.
#
# 그럼에도 CI에 넣지 않는 이유:
#   .NET Framework MSBuild가 필요하다(dotnet build로는 VSSDK 타깃이 돌지 않는다).
#   windows-latest 러너에 "Visual Studio 확장 빌드 도구" 워크로드가 있다는 보장이 없어,
#   러너 이미지 변경에 따라 조용히 다시 깨질 수 있다.
#   되살린다면 msbuild.exe 경로를 vswhere로 찾고, .vsix 산출물 존재를 명시적으로 단언할 것
#   (빌드 성공만으로는 아무것도 보장하지 않는다는 것이 위 사건의 교훈이다).
#
# .vsix는 Windows에서 수동으로 만든다. 산출물 경로에 net48이 들어간다:
#   msbuild src/DBVC.Vsix/DBVC.Vsix.csproj -restore -p:Configuration=Release
#   dir src\DBVC.Vsix\bin\Release\net48\*.vsix
#
# CI가 검증하는 범위는 빌드와 단위 테스트(net48 포함)까지다.
# WPF 렌더링, VS 패키지 로딩, .vsct 메뉴 등록, SSMS 통합은 CI로 검증되지 않으며
# SSMS 21 실행이 필요하다.
# ---------------------------------------------------------------------------
